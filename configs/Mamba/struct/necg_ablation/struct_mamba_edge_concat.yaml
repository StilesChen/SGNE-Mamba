# NECG fusion ablation; all other settings match struct_mamba_edge_mfsg.yaml.
# Scheme A. Same degree scanner; structural DFS replaces only the edge ordering.
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: False
dataset:
  format: OGB
  name: peptides-structural
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+LapPE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_LapPE:
  enable: True
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  raw_norm_type: none
train:
  mode: custom
  batch_size: 128
  eval_period: 1
  ckpt_period: 100
model:
  type: GPSModel
  loss_fun: l1
  graph_pooling: mean
gt:
  layer_type: CustomGatedGCN+Mamba_Edge
  layers: 4
  n_heads: 4
  dim_hidden: 96
  dropout: 0.0
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True
  enable_reverse_mamba: True
  fusion_mode: concat
  fixed_weight: 0.7
  scan_target: both
  edge_node_fusion_mode: concat
  edge_scan_order: node_edge_dfs
  edge_dfs_signature_rounds: 2
  edge_scan_precompute: False
  edge_mamba_residual_scale: 0.1
  node_edge_scale_mode: none
  node_edge_scale_value: 0.05
gnn:
  head: default
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 96
  batchnorm: True
  act: relu
  dropout: 0.0
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.01
  base_lr: 0.0003
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
seed: 0
