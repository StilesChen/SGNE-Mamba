# Mamba_Edge bfs ablation; all settings match func_mamba_edge_mfsg.yaml.
out_dir: results
metric_best: ap
metric_agg: argmax
wandb:
  use: False
  project: LRGB-Benchmark-RandomSeed
  entity: project
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+LapPE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
  split_mode: standard
posenc_LapPE:
  enable: True
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  raw_norm_type: none
train:
  mode: custom
  batch_size: 128
  eval_period: 1
  ckpt_period: 100
  nan_diagnostics: False
  detect_anomaly: False
  detect_nonfinite_forward: False
  numerical_debug: False
model:
  type: GPSModel
  loss_fun: cross_entropy
  graph_pooling: mean
gt:
  layer_type: CustomGatedGCN+Mamba_Edge
  layers: 4
  n_heads: 4
  dim_hidden: 96  # 与 gnn.dim_inner 保持一致。
  dropout: 0.0
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True
  enable_reverse_mamba: True
  scan_target: both
  edge_scan_order: node_edge_bfs
  edge_node_fusion_mode: mfsg
  edge_dfs_signature_rounds: 2
  edge_scan_precompute: False  # Sample scan before each forward encoder.
  edge_mamba_residual_scale: 0.1
  node_edge_scale_mode: none
  node_edge_scale_value: 1.0
gnn:
  head: default
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 96
  batchnorm: True
  act: relu
  dropout: 0.0
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.01
  base_lr: 0.001
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
seed: 0
device: cuda:0
