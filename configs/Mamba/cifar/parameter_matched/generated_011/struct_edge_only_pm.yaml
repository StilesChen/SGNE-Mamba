out_dir: results/capacity_ablation
metric_best: accuracy
wandb:
  use: false
  project: GNN-Benchmark-RandomSeed
  entity: project
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CIFAR10
  task: graph
  task_type: classification
  transductive: false
  node_encoder: true
  node_encoder_name: LapPE
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: LinearEdge
  edge_encoder_bn: false
posenc_LapPE:
  enable: true
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 8
  model: DeepSet
  dim_pe: 8
  layers: 2
  raw_norm_type: none
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
  nan_diagnostics: false
  detect_anomaly: false
  detect_nonfinite_forward: false
  numerical_debug: false
model:
  type: GPSModel
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: mean
gt:
  layer_type: CustomGatedGCN+Mamba_Edge
  layers: 3
  n_heads: 4
  dim_hidden: 72
  dropout: 0.0
  attn_dropout: 0.5
  layer_norm: false
  batch_norm: true
  enable_reverse_mamba: false
  scan_target: edge
  edge_scan_order: node_edge_dfs
  edge_dfs_signature_rounds: 2
  edge_scan_segmentation: native
  edge_scan_within_segment_shuffle: false
  edge_scan_max_segment_len: 512
  edge_dfs_use_attributes: true
  edge_state_transfer: full
  edge_scan_precompute: false
  edge_node_fusion_mode: single
  edge_mamba_residual_scale: 0.1
  node_edge_scale_mode: fixed
  node_edge_scale_value: 0.05
gnn:
  head: default
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 72
  batchnorm: false
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: false
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 0.01
  base_lr: 0.005
  max_epoch: 100
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
seed: 0
