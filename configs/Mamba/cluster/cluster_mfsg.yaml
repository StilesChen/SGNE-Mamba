out_dir: results
metric_best: accuracy-SBM
wandb:
  use: False
  project: GNN-Benchmark-RandomSeed
  entity: project
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CLUSTER
  task: graph
  task_type: classification
  transductive: False
  split_mode: standard
  node_encoder: True
  node_encoder_name: LapPE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
posenc_LapPE:
  enable: True
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  n_heads: 4  # Only used when `posenc.model: Transformer`
  raw_norm_type: none
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
  nan_diagnostics: False
  detect_anomaly: False
  detect_nonfinite_forward: False
  numerical_debug: False
model:
  type: GPSModel
  loss_fun: weighted_cross_entropy
  edge_decoding: dot
gt:
  layer_type: CustomGatedGCN+Mamba_Hybrid_Degree_Noise
  layers: 16
  n_heads: 8
  dim_hidden: 64  # Must match gnn.dim_inner
  dropout: 0.1
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True
  enable_reverse_mamba: False
  scan_target: both
  edge_scan_order: node_edge_dfs
  edge_node_fusion_mode: mfsg
  edge_mamba_residual_scale: 0.1
  node_edge_scale_mode: fixed
  node_edge_scale_value: 0.05
gnn:
  head: inductive_node
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64  # Must match gt.dim_hidden
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0001
  base_lr: 0.001
  max_epoch: 100
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
seed: 0
